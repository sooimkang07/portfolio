<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>How I’d measure whether the default works</title><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6d9dc"/></pattern></defs><rect width="1920" height="1080" rx="32" fill="#eff1f3"/><rect width="1920" height="1080" rx="32" fill="url(#dots)"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="105" font-size="38" fill="#20262d" font-weight="500">How I’d measure whether the default works</text><text x="100" y="151" font-size="23" fill="#20262d" font-weight="400">Proposed pilot targets · not measured outcomes</text><rect x="100" y="265" width="556" height="615" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="132" y="331" font-size="24" fill="#20262d" font-weight="400">WITHIN 3 MONTHS</text><text x="132" y="468" font-size="88" fill="#1f5a4b" font-weight="500">≥20%</text><text x="132" y="545" font-size="38" fill="#20262d" font-weight="500">Adoption</text><text x="132" y="644" font-size="28" fill="#626b76" font-weight="400">Use of portion-controlled bundles</text><text x="132" y="685" font-size="28" fill="#626b76" font-weight="400">with no increase in checkout</text><text x="132" y="726" font-size="28" fill="#626b76" font-weight="400">abandonment.</text><rect x="682" y="265" width="556" height="615" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="714" y="331" font-size="24" fill="#20262d" font-weight="400">WITHIN 12 MONTHS</text><text x="714" y="468" font-size="88" fill="#1f5a4b" font-weight="500">15–20%</text><text x="714" y="545" font-size="38" fill="#20262d" font-weight="500">Less spoilage</text><text x="714" y="644" font-size="28" fill="#626b76" font-weight="400">Reduction in post-delivery</text><text x="714" y="685" font-size="28" fill="#626b76" font-weight="400">spoilage signals for bundled</text><text x="714" y="726" font-size="28" fill="#626b76" font-weight="400">categories.</text><rect x="1264" y="265" width="556" height="615" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="1296" y="331" font-size="24" fill="#20262d" font-weight="400">WITHIN 6 MONTHS</text><text x="1296" y="468" font-size="88" fill="#1f5a4b" font-weight="500">10–15%</text><text x="1296" y="545" font-size="38" fill="#20262d" font-weight="500">Reorder lift</text><text x="1296" y="644" font-size="28" fill="#626b76" font-weight="400">Improvement in reorder consistency</text><text x="1296" y="685" font-size="28" fill="#626b76" font-weight="400">and repeat purchase rate</text><text x="1296" y="726" font-size="28" fill="#626b76" font-weight="400">among bundle users.</text></g></svg>