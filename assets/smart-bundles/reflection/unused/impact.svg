<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>One change in defaults. Four connected effects.</title><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6d9dc"/></pattern></defs><rect width="1920" height="1080" rx="32" fill="#eff1f3"/><rect width="1920" height="1080" rx="32" fill="url(#dots)"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="105" font-size="38" fill="#20262d" font-weight="500">One change in defaults. Four connected effects.</text><text x="100" y="151" font-size="23" fill="#20262d" font-weight="400">Intended system impact · hypotheses to validate through a pilot</text><rect x="100" y="265" width="406" height="615" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="128" y="335" font-size="38" fill="#20262d" font-weight="500">Systems</text><text x="128" y="440" font-size="26" fill="#626b76" font-weight="400">One-off transactions become</text><text x="128" y="481" font-size="26" fill="#626b76" font-weight="400">a continuous learning loop.</text><text x="128" y="585" font-size="55" fill="#1f5a4b" font-weight="400">↓</text><text x="128" y="725" font-size="26" fill="#1f5a4b" font-weight="400">Future quantities reflect</text><text x="128" y="766" font-size="26" fill="#1f5a4b" font-weight="400">what actually gets eaten.</text><rect x="538" y="265" width="406" height="615" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="566" y="335" font-size="38" fill="#20262d" font-weight="500">People</text><text x="566" y="440" font-size="26" fill="#626b76" font-weight="400">Portion guidance appears</text><text x="566" y="481" font-size="26" fill="#626b76" font-weight="400">inside regular shopping.</text><text x="566" y="585" font-size="55" fill="#1f5a4b" font-weight="400">↓</text><text x="566" y="725" font-size="26" fill="#1f5a4b" font-weight="400">Less overbuying, without</text><text x="566" y="766" font-size="26" fill="#1f5a4b" font-weight="400">extra planning or tracking.</text><rect x="976" y="265" width="406" height="615" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="1004" y="335" font-size="38" fill="#20262d" font-weight="500">Climate</text><text x="1004" y="440" font-size="26" fill="#626b76" font-weight="400">Fewer ingredients are grown,</text><text x="1004" y="481" font-size="26" fill="#626b76" font-weight="400">shipped and discarded unused.</text><text x="1004" y="585" font-size="55" fill="#1f5a4b" font-weight="400">↓</text><text x="1004" y="725" font-size="26" fill="#1f5a4b" font-weight="400">Less household food waste</text><text x="1004" y="766" font-size="26" fill="#1f5a4b" font-weight="400">and associated emissions.</text><rect x="1414" y="265" width="406" height="615" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="1442" y="335" font-size="38" fill="#20262d" font-weight="500">Business</text><text x="1442" y="440" font-size="26" fill="#626b76" font-weight="400">Recommendations improve</text><text x="1442" y="481" font-size="26" fill="#626b76" font-weight="400">as household needs</text><text x="1442" y="522" font-size="26" fill="#626b76" font-weight="400">become clearer.</text><text x="1442" y="585" font-size="55" fill="#1f5a4b" font-weight="400">↓</text><text x="1442" y="725" font-size="26" fill="#1f5a4b" font-weight="400">Fewer spoilage complaints;</text><text x="1442" y="766" font-size="26" fill="#1f5a4b" font-weight="400">greater trust and repeat use.</text></g></svg>