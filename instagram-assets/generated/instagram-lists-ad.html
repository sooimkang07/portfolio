<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --ig: linear-gradient(200deg, #4F5BD5 0%, #962FBF 22%, #D62976 50%, #FA7E1E 78%, #FEDA75 100%); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: Inter, -apple-system, sans-serif; }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }

  /* phone-shaped frame, Instagram gradient border, everything outside softly dimmed */
  .frame { position: absolute; left: 690px; top: 56px; width: 500px; height: 968px; border-radius: 44px;
           box-shadow: 0 0 0 3000px rgba(10, 10, 14, .42); }
  .frame::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 9px; background: var(--ig);
           -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

  /* list pills inside the top of the frame */
  .lists { position: absolute; left: 30px; top: 34px; display: flex; gap: 8px; }
  .chip { height: 40px; padding: 0 16px; border-radius: 10px; display: flex; align-items: center; font-size: 17px; font-weight: 600; }
  .chip.plus { width: 40px; padding: 0; justify-content: center; font-size: 24px; font-weight: 500; background: #F2F3F5; color: #111; }
  .chip.soft { background: #EAF0FF; color: #4D6BE8; }
  .chip.cf { background: #5FD35A; color: #fff; }
  .chip.parsons { background: #E5312B; color: #fff; }

  /* Reels-style action rail */
  .rail { position: absolute; right: 22px; bottom: 150px; display: flex; flex-direction: column; align-items: center; gap: 22px; color: #fff; }
  .rail div { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .rail svg { width: 34px; height: 34px; filter: drop-shadow(0 1px 4px rgba(0,0,0,.35)); }

  /* notification toasts overlapping the frame edge */
  .toast { position: absolute; display: flex; align-items: center; gap: 18px; height: 84px; padding: 0 30px 0 16px; border-radius: 26px;
           background: rgba(150, 150, 150, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
           color: #fff; font-size: 25px; font-weight: 500; white-space: nowrap; box-shadow: 0 14px 34px -12px rgba(0,0,0,.45); }
  .toast b { font-weight: 700; }
  .toast .view { margin-left: 34px; font-weight: 700; }
  .avatar { width: 54px; height: 54px; border-radius: 50%; flex: none; background-image: url("file:///Users/sooimkang/Developer/portfolio/instagram-assets/reflection/instagram-reflection-2.jpg");
            background-size: 768px 432px; box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
  .n1 { left: 1060px; top: 176px; }
  .n2 { left: 1060px; top: 280px; }

  /* list card: stacked avatars, list color, member count */
  .listcard { position: absolute; left: 1060px; top: 280px; display: flex; align-items: center; gap: 20px; height: 100px; padding: 0 34px 0 22px;
              border-radius: 22px; background: #fff; color: #111; white-space: nowrap; box-shadow: 0 14px 34px -12px rgba(0,0,0,.45); }
  .stack { position: relative; width: 70px; height: 70px; flex: none; }
  .stack .avatar { position: absolute; width: 52px; height: 52px; box-shadow: 0 0 0 3px #fff; }
  .stack .avatar:first-child { left: 0; top: 0; }
  .stack .avatar:last-child { right: 0; bottom: 0; }
  .lc-title { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; }
  .lc-title i { width: 22px; height: 22px; border-radius: 6px; background: #E5312B; }
  .lc-sub { margin-top: 4px; font-size: 21px; color: #7a7f86; }

  /* list colors in the corner */
  .swatches { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 14px; }
  .swatches i { width: 56px; height: 56px; border-radius: 15px; display: grid; place-items: center; box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); }
  .swatches i.star { border-radius: 50%; }

  /* headline, bold italic, overlapping the frame */
  .headline { position: absolute; left: 604px; top: 574px; font-family: Montserrat, sans-serif; font-style: italic; font-weight: 900;
              font-size: 112px; line-height: .92; letter-spacing: -2px; color: #fff; text-transform: uppercase;
              text-shadow: 0 6px 40px rgba(0,0,0,.35); }

</style></head>
<body><div class="stage">
  <img class="photo" src="file:///Users/sooimkang/Developer/portfolio/instagram-assets/reflection/instagram-reflection-2.jpg" alt="">

  <div class="frame">
    <div class="lists"><span class="chip plus">+</span><span class="chip soft">All</span><span class="chip soft">Following</span><span class="chip parsons">Parsons</span></div>
    <div class="rail">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.6 8 3.4 4.5 6.9 4.5c2 0 3.5 1.1 5.1 3 1.6-1.9 3.1-3 5.1-3 3.5 0 5.3 3.5 4.2 6.6-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg>2.4K</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20.5 12a8.5 8.5 0 1 1-3.1-6.6A8.4 8.4 0 0 1 20.5 12c0 1.6-.4 3-1.2 4.3l1.2 4.2-4.3-1.2"/></svg>186</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M21.5 3.5 2.5 10.2l7.6 3.3 3.3 7.6 8.1-17.6zM10.1 13.5l5.4-5.4"/></svg>312</div>
    </div>
  </div>

  <div class="toast n1"><span class="avatar" style="background-position:-323px -156px"></span><span>Added <b>chareeselam</b> to Parsons list</span><span class="view">View</span></div>
  <div class="listcard"><span class="stack"><span class="avatar" style="background-position:-321px -46px"></span><span class="avatar" style="background-position:-395px -86px"></span></span><div><div class="lc-title"><i></i>Parsons</div><div class="lc-sub">chareeselam and 23 others</div></div></div>

  <div class="swatches"><i class="star" style="background:#5FD35A"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg></i><i style="background:#A020C0"></i><i style="background:#E5312B"></i><i style="background:#F28C38"></i><i style="background:#3F97F5"></i><i style="background:#9A6235"></i><i style="background:#F7CB5B"></i><i style="background:#D8306B"></i></div>

  <h1 class="headline">Your<br>people,<br>first.</h1>

</div></body></html>
