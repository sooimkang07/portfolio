<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow" />
	<title>Sooim Kang · Product Designer</title>
	<link rel="icon" href="favicon.ico" />
	<link rel="stylesheet" href="css/base.css?v=layout-sb-2" />
	<style>
		html, body { min-block-size: 100%; }
		body {
			display: grid;
			place-items: center;
			min-block-size: 100vh;
			min-block-size: 100dvh;
			padding: var(--gutter);
		}
		.gate {
			inline-size: min(100%, 24rem);
			text-align: center;
		}
		.gate__label {
			font-size: 11.25px;
			font-weight: var(--fw-semi);
			letter-spacing: 0.04em;
			text-transform: uppercase;
			color: var(--clr-text);
		}
		.gate__title {
			margin-block: var(--sp-md) 0.5rem;
			font-size: var(--fs-lg);
			font-weight: var(--fw-medium);
			line-height: var(--lh-tight);
		}
		.gate__copy {
			font-size: var(--fs-sm);
			color: var(--clr-muted);
		}
		.gate__copy a { color: var(--clr-text); text-decoration: underline; text-underline-offset: 2px; }
		.gate__form {
			display: flex;
			gap: 0.5rem;
			margin-block-start: var(--sp-lg);
			padding: 0.3rem;
			border-radius: 999px;
			background: #F1F2EF;
			transition: box-shadow var(--t-fast) var(--ease);
		}
		.gate__form:focus-within { box-shadow: 0 0 0 2px var(--clr-text); }
		.gate__input {
			flex: 1;
			min-inline-size: 0;
			padding: 0.65rem 1rem;
			border: 0;
			outline: 0;
			background: none;
			color: var(--clr-text);
			font: inherit;
			font-size: var(--fs-md);
			letter-spacing: 0.2em;
		}
		.gate__input::placeholder { letter-spacing: 0; color: var(--clr-muted); }
		.gate__submit {
			flex: none;
			padding: 0.65rem 1.25rem;
			border-radius: 999px;
			background: var(--clr-text);
			color: #fff;
			font-weight: var(--fw-medium);
			transition: opacity var(--t-fast) var(--ease);
		}
		.gate__submit:hover { opacity: 0.85; }
		.gate__submit:focus-visible { outline: 2px solid var(--clr-text); outline-offset: 2px; }
		.gate__error {
			min-block-size: 1.5em;
			margin-block-start: 0.75rem;
			font-size: var(--fs-sm);
			color: #c2352b;
		}
		.gate__form.is-wrong { animation: gate-shake 0.36s var(--ease); }
		@keyframes gate-shake {
			20%, 60% { transform: translateX(-6px); }
			40%, 80% { transform: translateX(6px); }
		}
		@media (prefers-reduced-motion: reduce) {
			.gate__form.is-wrong { animation: none; }
		}
	</style>
</head>
<body>
	<main class="gate">
		<p class="gate__label">Sooim Kang</p>
		<h1 class="gate__title">This portfolio is password protected.</h1>
		<p class="gate__copy">Need access? Email <a href="mailto:sooimkang1015@gmail.com">sooimkang1015@gmail.com</a></p>
		<form class="gate__form" novalidate>
			<label class="gate__sr" for="gate-password" style="position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</label>
			<input class="gate__input" id="gate-password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Password" autofocus required />
			<button class="gate__submit" type="submit">Enter</button>
		</form>
		<p class="gate__error" role="alert" aria-live="assertive"></p>
	</main>

	<script>
	(function () {
		'use strict';
		// Must match PASS_HASH in js/preview-gate.js (SHA-256 of the password).
		var PASS_HASH = '8e52ad3ae476e1f94dc9774e79752857b5127e6417ce8cd911f99f5bab3a277e';
		var STORAGE_KEY = 'portfolio_pass';

		var form = document.querySelector('.gate__form');
		var input = document.getElementById('gate-password');
		var error = document.querySelector('.gate__error');

		function nextUrl() {
			var next = new URLSearchParams(location.search).get('next') || '/';
			// Only same-site paths.
			return /^\/(?!\/)/.test(next) ? next : '/';
		}

		function hex(buffer) {
			return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
				return ('0' + b.toString(16)).slice(-2);
			}).join('');
		}

		// Already unlocked on this device: skip straight through.
		try {
			if (localStorage.getItem(STORAGE_KEY) === PASS_HASH) { location.replace(nextUrl()); return; }
		} catch (e) {}

		form.addEventListener('submit', function (e) {
			e.preventDefault();
			var value = input.value.trim();
			if (!value) { input.focus(); return; }
			crypto.subtle.digest('SHA-256', new TextEncoder().encode(value)).then(function (buf) {
				if (hex(buf) === PASS_HASH) {
					try { localStorage.setItem(STORAGE_KEY, PASS_HASH); } catch (err) {}
					try { sessionStorage.setItem(STORAGE_KEY, PASS_HASH); } catch (err) {}
					location.replace(nextUrl());
				} else {
					error.textContent = "That's not it. Try again.";
					form.classList.remove('is-wrong');
					void form.offsetWidth;
					form.classList.add('is-wrong');
					input.select();
				}
			});
		});
	})();
	</script>
</body>
</html>
