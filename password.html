<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sooim Kang · Product Designer</title>
    <link rel="icon" href="favicon/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/32.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon/64.png?v=2" />
    <link rel="apple-touch-icon" href="favicon/touch.png?v=2" />
    <link rel="stylesheet" href="css/base.css?v=spacing103" />
    <link rel="stylesheet" href="css/password.css?v=spacing57" />
  </head>
  <body>
    <main class="gate">
      <p class="gate__label">Sooim Kang</p>
      <h1 class="gate__title">This portfolio is password protected.</h1>
      <p class="gate__copy">
        Need access? Email
        <a href="mailto:sooimkang1015@gmail.com">sooimkang1015@gmail.com</a>
      </p>
      <form class="gate__form" novalidate>
        <label class="gate__sr" for="gate-password">Password</label>
        <input
          class="gate__input"
          id="gate-password"
          type="password"
          inputmode="numeric"
          autocomplete="current-password"
          placeholder="Password"
          autofocus
          required
        />
        <button class="gate__submit" type="submit">Enter</button>
      </form>
      <p class="gate__error" role="alert" aria-live="assertive"></p>
    </main>

    <script>
      (function () {
        "use strict";
        // Must match PASS_HASH in js/preview-gate.js (SHA-256 of the password).
        var PASS_HASH = "8e52ad3ae476e1f94dc9774e79752857b5127e6417ce8cd911f99f5bab3a277e";
        var STORAGE_KEY = "portfolio_pass";

        var form = document.querySelector(".gate__form");
        var input = document.getElementById("gate-password");
        var error = document.querySelector(".gate__error");

        function nextUrl() {
          var next = new URLSearchParams(location.search).get("next") || "/";
          // Only same-site paths.
          return /^\/(?!\/)/.test(next) ? next : "/";
        }

        function hex(buffer) {
          return Array.prototype.map
            .call(new Uint8Array(buffer), function (b) {
              return ("0" + b.toString(16)).slice(-2);
            })
            .join("");
        }

        // Already unlocked on this device: skip straight through.
        try {
          if (localStorage.getItem(STORAGE_KEY) === PASS_HASH) {
            location.replace(nextUrl());
            return;
          }
        } catch (e) {}

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var value = input.value.trim();
          if (!value) {
            input.focus();
            return;
          }
          crypto.subtle.digest("SHA-256", new TextEncoder().encode(value)).then(function (buf) {
            if (hex(buf) === PASS_HASH) {
              try {
                localStorage.setItem(STORAGE_KEY, PASS_HASH);
              } catch (err) {}
              try {
                sessionStorage.setItem(STORAGE_KEY, PASS_HASH);
              } catch (err) {}
              location.replace(nextUrl());
            } else {
              error.textContent = "That's not it. Try again.";
              form.classList.remove("is-wrong");
              void form.offsetWidth;
              form.classList.add("is-wrong");
              input.select();
            }
          });
        });
      })();
    </script>
  </body>
</html>
