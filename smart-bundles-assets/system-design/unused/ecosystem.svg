<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>A grocery journey that learns from the kitchen</title><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6d9dc"/></pattern></defs><rect width="1920" height="1080" rx="32" fill="#eff1f3"/><rect width="1920" height="1080" rx="32" fill="url(#dots)"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="105" font-size="38" fill="#20262d" font-weight="500">A grocery journey that learns from the kitchen</text><text x="100" y="151" font-size="23" fill="#20262d" font-weight="400">Existing Fresh journey → Smart Bundles intervention → better defaults for the next order</text><rect x="95" y="275" width="195" height="102" rx="17" fill="#fff" stroke="#d6d9dc"/><text x="113" y="338" font-size="28" fill="#20262d" font-weight="500">Discover</text><text x="294" y="338" font-size="23" fill="#20262d" font-weight="400">→</text><rect x="315" y="275" width="195" height="102" rx="17" fill="#fff" stroke="#d6d9dc"/><text x="333" y="338" font-size="28" fill="#20262d" font-weight="500">Select</text><text x="514" y="338" font-size="23" fill="#20262d" font-weight="400">→</text><rect x="535" y="275" width="195" height="102" rx="17" fill="#fff" stroke="#d6d9dc"/><text x="553" y="338" font-size="28" fill="#20262d" font-weight="500">Cart</text><text x="734" y="338" font-size="23" fill="#20262d" font-weight="400">→</text><rect x="755" y="275" width="195" height="102" rx="17" fill="#fff" stroke="#d6d9dc"/><text x="773" y="338" font-size="28" fill="#20262d" font-weight="500">Checkout</text><text x="954" y="338" font-size="23" fill="#20262d" font-weight="400">→</text><rect x="975" y="275" width="195" height="102" rx="17" fill="#fff" stroke="#d6d9dc"/><text x="993" y="338" font-size="28" fill="#20262d" font-weight="500">Delivery</text><text x="1174" y="338" font-size="23" fill="#20262d" font-weight="400">→</text><rect x="1195" y="275" width="195" height="102" rx="17" fill="#fff" stroke="#d6d9dc"/><text x="1213" y="338" font-size="28" fill="#20262d" font-weight="500">Consume</text><text x="1394" y="338" font-size="23" fill="#20262d" font-weight="400">→</text><rect x="1415" y="275" width="195" height="102" rx="17" fill="#fff" stroke="#d6d9dc"/><text x="1433" y="338" font-size="28" fill="#20262d" font-weight="500">Learn</text><text x="1614" y="338" font-size="23" fill="#20262d" font-weight="400">→</text><rect x="1635" y="275" width="195" height="102" rx="17" fill="#fff" stroke="#d6d9dc"/><text x="1653" y="338" font-size="28" fill="#20262d" font-weight="500">Dispose</text><path d="M302.5 377 V465" stroke="#91aca3" stroke-width="3" stroke-dasharray="7 7"/><rect x="95" y="465" width="415" height="225" rx="18" fill="#e5ecea" stroke="#d6d9dc"/><text x="114" y="522" font-size="25" fill="#1f5a4b" font-weight="500">Discover + select</text><text x="114" y="580" font-size="24" fill="#1f5a4b" font-weight="400">Behavior-based bundles</text><text x="114" y="616" font-size="24" fill="#1f5a4b" font-weight="400">Pre-portioned ingredients</text><path d="M742.5 377 V465" stroke="#91aca3" stroke-width="3" stroke-dasharray="7 7"/><rect x="535" y="465" width="415" height="225" rx="18" fill="#e5ecea" stroke="#d6d9dc"/><text x="554" y="522" font-size="25" fill="#1f5a4b" font-weight="500">Cart + checkout</text><text x="554" y="580" font-size="24" fill="#1f5a4b" font-weight="400">Edit any item or quantity</text><text x="554" y="616" font-size="24" fill="#1f5a4b" font-weight="400">Keep control before paying</text><path d="M1072.5 377 V465" stroke="#91aca3" stroke-width="3" stroke-dasharray="7 7"/><rect x="975" y="465" width="195" height="225" rx="18" fill="#e5ecea" stroke="#d6d9dc"/><text x="994" y="522" font-size="25" fill="#1f5a4b" font-weight="500">Delivery</text><text x="994" y="580" font-size="24" fill="#1f5a4b" font-weight="400">Right-sized</text><text x="994" y="616" font-size="24" fill="#1f5a4b" font-weight="400">portions</text><path d="M1292.5 377 V465" stroke="#91aca3" stroke-width="3" stroke-dasharray="7 7"/><rect x="1195" y="465" width="195" height="225" rx="18" fill="#e5ecea" stroke="#d6d9dc"/><text x="1214" y="522" font-size="25" fill="#1f5a4b" font-weight="500">Consume</text><text x="1214" y="580" font-size="24" fill="#1f5a4b" font-weight="400">Finish what</text><text x="1214" y="616" font-size="24" fill="#1f5a4b" font-weight="400">was bought</text><path d="M1512.5 377 V465" stroke="#91aca3" stroke-width="3" stroke-dasharray="7 7"/><rect x="1415" y="465" width="195" height="225" rx="18" fill="#e5ecea" stroke="#d6d9dc"/><text x="1434" y="522" font-size="25" fill="#1f5a4b" font-weight="500">Learn</text><text x="1434" y="580" font-size="24" fill="#1f5a4b" font-weight="400">Optional</text><text x="1434" y="616" font-size="24" fill="#1f5a4b" font-weight="400">feedback</text><path d="M1512 700 V850 H190 V705" fill="none" stroke="#1f5a4b" stroke-width="4" stroke-dasharray="10 9"/><text x="495" y="919" font-size="32" fill="#1f5a4b" font-weight="400">Feedback adjusts future defaults—not the way people shop or cook.</text></g></svg>