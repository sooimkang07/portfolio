<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Where waste accumulates today</title><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6d9dc"/></pattern></defs><rect width="1920" height="1080" rx="32" fill="#eff1f3"/><rect width="1920" height="1080" rx="32" fill="url(#dots)"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="105" font-size="38" fill="#20262d" font-weight="500">Where waste accumulates today</text><text x="100" y="151" font-size="23" fill="#20262d" font-weight="400">A journey map of purchase intent, household reality, and the missing feedback signal</text><rect x="100" y="265" width="406" height="600" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="126" y="322" font-size="24" fill="#1f5a4b" font-weight="400">01</text><text x="126" y="377" font-size="40" fill="#20262d" font-weight="500">Cart</text><text x="126" y="451" font-size="27" fill="#626b76" font-weight="400">Build a grocery order</text><text x="126" y="492" font-size="27" fill="#626b76" font-weight="400">from individual items.</text><text x="126" y="587" font-size="27" fill="#a34939" font-weight="400">Easy to buy more</text><text x="126" y="628" font-size="27" fill="#a34939" font-weight="400">than the household needs.</text><text x="126" y="741" font-size="27" fill="#1f5a4b" font-weight="400">Right-size quantities</text><text x="126" y="782" font-size="27" fill="#1f5a4b" font-weight="400">before purchase.</text><text x="510" y="536" font-size="28" fill="#20262d" font-weight="400">→</text><rect x="538" y="265" width="406" height="600" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="564" y="322" font-size="24" fill="#1f5a4b" font-weight="400">02</text><text x="564" y="377" font-size="40" fill="#20262d" font-weight="500">Delivery</text><text x="564" y="451" font-size="27" fill="#626b76" font-weight="400">Receive perishables</text><text x="564" y="492" font-size="27" fill="#626b76" font-weight="400">in fixed pack sizes.</text><text x="564" y="587" font-size="27" fill="#a34939" font-weight="400">Food arrives faster</text><text x="564" y="628" font-size="27" fill="#a34939" font-weight="400">than it can be used.</text><text x="564" y="741" font-size="27" fill="#1f5a4b" font-weight="400">Deliver portions that fit</text><text x="564" y="782" font-size="27" fill="#1f5a4b" font-weight="400">actual consumption.</text><text x="948" y="536" font-size="28" fill="#20262d" font-weight="400">→</text><rect x="976" y="265" width="406" height="600" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="1002" y="322" font-size="24" fill="#1f5a4b" font-weight="400">03</text><text x="1002" y="377" font-size="40" fill="#20262d" font-weight="500">At home</text><text x="1002" y="451" font-size="27" fill="#626b76" font-weight="400">Fit cooking around</text><text x="1002" y="492" font-size="27" fill="#626b76" font-weight="400">changing routines.</text><text x="1002" y="587" font-size="27" fill="#a34939" font-weight="400">Plans change.</text><text x="1002" y="628" font-size="27" fill="#a34939" font-weight="400">Meals get skipped.</text><text x="1002" y="741" font-size="27" fill="#1f5a4b" font-weight="400">Keep bundles flexible</text><text x="1002" y="782" font-size="27" fill="#1f5a4b" font-weight="400">and easy to adjust.</text><text x="1386" y="536" font-size="28" fill="#20262d" font-weight="400">→</text><rect x="1414" y="265" width="406" height="600" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="1440" y="322" font-size="24" fill="#1f5a4b" font-weight="400">04</text><text x="1440" y="377" font-size="40" fill="#20262d" font-weight="500">Leftovers</text><text x="1440" y="451" font-size="27" fill="#626b76" font-weight="400">Store or discard</text><text x="1440" y="492" font-size="27" fill="#626b76" font-weight="400">what remains.</text><text x="1440" y="587" font-size="27" fill="#a34939" font-weight="400">Uneaten food is invisible</text><text x="1440" y="628" font-size="27" fill="#a34939" font-weight="400">to the shopping system.</text><text x="1440" y="741" font-size="27" fill="#1f5a4b" font-weight="400">Feed a quick check-in</text><text x="1440" y="782" font-size="27" fill="#1f5a4b" font-weight="400">into the next order.</text><text x="100" y="974" font-size="29" fill="#20262d" font-weight="400">↶  Today, no consumption signal closes the loop. Smart Bundles makes that learning optional and easy.</text></g></svg>