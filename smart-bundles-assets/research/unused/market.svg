<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Why try again—and why now?</title><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6d9dc"/></pattern></defs><rect width="1920" height="1080" rx="32" fill="#eff1f3"/><rect width="1920" height="1080" rx="32" fill="url(#dots)"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="105" font-size="38" fill="#20262d" font-weight="500">Why try again—and why now?</text><text x="100" y="151" font-size="23" fill="#20262d" font-weight="400">Market signals captured in the original Smart Bundles research</text><rect x="100" y="300" width="556" height="510" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="134" y="430" font-size="88" fill="#1f5a4b" font-weight="500">11%+</text><text x="134" y="505" font-size="35" fill="#20262d" font-weight="500">Online grocery growth</text><text x="134" y="590" font-size="28" fill="#626b76" font-weight="400">Projected CAGR through 2030</text><text x="134" y="631" font-size="28" fill="#626b76" font-weight="400">Convenience and digital adoption</text><text x="134" y="672" font-size="28" fill="#626b76" font-weight="400">are expanding grocery delivery.</text><rect x="682" y="300" width="556" height="510" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="716" y="430" font-size="88" fill="#1f5a4b" font-weight="500">~10.7%</text><text x="716" y="505" font-size="35" fill="#20262d" font-weight="500">U.S. meal-kit growth</text><text x="716" y="590" font-size="28" fill="#626b76" font-weight="400">Annual market growth</text><text x="716" y="631" font-size="28" fill="#626b76" font-weight="400">Demand is rising for help with</text><text x="716" y="672" font-size="28" fill="#626b76" font-weight="400">everyday meal decisions.</text><rect x="1264" y="300" width="556" height="510" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="1298" y="430" font-size="88" fill="#1f5a4b" font-weight="500">2,300+</text><text x="1298" y="505" font-size="35" fill="#20262d" font-weight="500">U.S. cities</text><text x="1298" y="590" font-size="28" fill="#626b76" font-weight="400">Amazon same-day grocery reach</text><text x="1298" y="631" font-size="28" fill="#626b76" font-weight="400">An existing delivery network offers</text><text x="1298" y="672" font-size="28" fill="#626b76" font-weight="400">a route to scale portion intelligence.</text><text x="100" y="948" font-size="30" fill="#20262d" font-weight="400">Opportunity: combine demand for meal support with the flexibility of an existing grocery ecosystem.</text></g></svg>