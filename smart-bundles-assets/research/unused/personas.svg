<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Three shopping behaviors. One clear opportunity.</title><defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6d9dc"/></pattern></defs><rect width="1920" height="1080" rx="32" fill="#eff1f3"/><rect width="1920" height="1080" rx="32" fill="url(#dots)"/><g font-family="Arial, Helvetica, sans-serif"><text x="100" y="105" font-size="38" fill="#20262d" font-weight="500">Three shopping behaviors. One clear opportunity.</text><text x="100" y="151" font-size="23" fill="#20262d" font-weight="400">Behavioral segments from a national study of ~1,000 U.S. households referenced in the project</text><rect x="100" y="230" width="556" height="590" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="132" y="282" font-size="23" fill="#20262d" font-weight="400">01 / LOWEST WASTE</text><text x="132" y="385" font-size="86" fill="#1f5a4b" font-weight="500">40%</text><text x="132" y="441" font-size="35" fill="#20262d" font-weight="500">Structured planners</text><text x="132" y="510" font-size="27" fill="#626b76" font-weight="400">Deliberate shoppers</text><text x="132" y="551" font-size="27" fill="#626b76" font-weight="400">Strong planning habits</text><text x="132" y="592" font-size="27" fill="#626b76" font-weight="400">Active waste reduction</text><rect x="130" y="680" width="496" height="105" rx="15" fill="#dbe5df" stroke="#d6d9dc"/><text x="150" y="741" font-size="25" fill="#1f5a4b" font-weight="400">Support habits already in place.</text><rect x="682" y="230" width="556" height="590" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="714" y="282" font-size="23" fill="#20262d" font-weight="400">02 / MODERATE WASTE</text><text x="714" y="385" font-size="86" fill="#1f5a4b" font-weight="500">47%</text><text x="714" y="441" font-size="35" fill="#20262d" font-weight="500">Flexible planners</text><text x="714" y="510" font-size="27" fill="#626b76" font-weight="400">Casual, spontaneous shoppers</text><text x="714" y="551" font-size="27" fill="#626b76" font-weight="400">Positive attitudes toward</text><text x="714" y="592" font-size="27" fill="#626b76" font-weight="400">reducing food waste</text><rect x="712" y="680" width="496" height="105" rx="15" fill="#c9d8d2" stroke="#d6d9dc"/><text x="732" y="741" font-size="25" fill="#1f5a4b" font-weight="400">Preserve room for changing plans.</text><rect x="1264" y="230" width="556" height="590" rx="24" fill="#fff" stroke="#d6d9dc"/><text x="1296" y="282" font-size="23" fill="#20262d" font-weight="400">03 / HIGHEST WASTE</text><text x="1296" y="385" font-size="86" fill="#1f5a4b" font-weight="500">13%</text><text x="1296" y="441" font-size="35" fill="#20262d" font-weight="500">Young wasters</text><text x="1296" y="510" font-size="27" fill="#626b76" font-weight="400">Younger, lower-income households</text><text x="1296" y="551" font-size="27" fill="#626b76" font-weight="400">Minimal planning habits</text><text x="1296" y="592" font-size="27" fill="#626b76" font-weight="400">More proteins, oils and grains wasted</text><rect x="1294" y="680" width="496" height="105" rx="15" fill="#1f5a4b" stroke="#d6d9dc"/><text x="1314" y="741" font-size="25" fill="white" font-weight="400">Make portion control the default.</text><text x="100" y="920" font-size="62" fill="#1f5a4b" font-weight="500">~7× / week</text><text x="610" y="891" font-size="29" fill="#626b76" font-weight="400">Food-waste frequency among Young Wasters, versus ~4.5× for other groups.</text><text x="610" y="932" font-size="29" fill="#626b76" font-weight="400">The smallest segment offers the strongest opportunity for targeted support.</text></g></svg>